<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲숨 마을: 환경윤리 에디션</title>
<style>
:root{
  --bg:#e5eee8; --surface:#ffffff; --surface2:#f0f6f1; --text:#18261f; --muted:#55675b; --line:#c9d9ce;
  --primary:#2b6e4f; --primary-deep:#1c4d36; --primary-ink:#ffffff; --primary-soft:#d6ebde;
  --sky:#336a9c; --sky-bg:#e0ebf6;
  --dev:#985821; --dev-bg:#f8eadb; --ref:#1f774d; --ref-bg:#dcf1e3;
  --warn:#9c6c00; --warn-bg:#fff2cc; --danger:#bc3829; --danger-bg:#fbe1dd;
  --hud:#12271f; --hud2:#1c3b2e; --hud-line:#2f5644; --hud-ink:#f3efd8; --hud-muted:#b5c6b2; --gold:#e6bf4f; --gold-deep:#a8841f;
  --sky-top:#bfe4f7; --sky-bot:#eaf6ee; --hill:#a6d8ae; --road:#e6dbc2; --road-line:#ffffff; --smog:#8a7a5c;
  --shadow:0 3px 0 rgba(20,40,30,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1813; --surface:#19251f; --surface2:#203029; --text:#e6efe8; --muted:#a2b5a8; --line:#33463a;
    --primary:#6cc796; --primary-deep:#3f8a62; --primary-ink:#0d1a12; --primary-soft:#21402f;
    --sky:#8ab7e6; --sky-bg:#1a2b3d;
    --dev:#f0ad6e; --dev-bg:#382614; --ref:#78d6a3; --ref-bg:#173424;
    --warn:#f2c85a; --warn-bg:#3a3012; --danger:#ff8070; --danger-bg:#3d1d19;
    --hud:#0a1712; --hud2:#14291f; --hud-line:#2a4a3b; --hud-ink:#f3efd8; --hud-muted:#a9bba6; --gold:#f0cb62; --gold-deep:#a8841f;
    --sky-top:#15253a; --sky-bot:#1d3a33; --hill:#2b593d; --road:#3a3528; --road-line:#5d5543; --smog:#4a3f2c;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1813; --surface:#19251f; --surface2:#203029; --text:#e6efe8; --muted:#a2b5a8; --line:#33463a;
  --primary:#6cc796; --primary-deep:#3f8a62; --primary-ink:#0d1a12; --primary-soft:#21402f;
  --sky:#8ab7e6; --sky-bg:#1a2b3d;
  --dev:#f0ad6e; --dev-bg:#382614; --ref:#78d6a3; --ref-bg:#173424;
  --warn:#f2c85a; --warn-bg:#3a3012; --danger:#ff8070; --danger-bg:#3d1d19;
  --hud:#0a1712; --hud2:#14291f; --hud-line:#2a4a3b; --hud-ink:#f3efd8; --hud-muted:#a9bba6; --gold:#f0cb62; --gold-deep:#a8841f;
  --sky-top:#15253a; --sky-bot:#1d3a33; --hill:#2b593d; --road:#3a3528; --road-line:#5d5543; --smog:#4a3f2c;
  --shadow:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",system-ui,sans-serif;
  font-size:18px;line-height:1.6;word-break:keep-all;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hud);}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 40px}

/* ===== 상단 HUD ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hud);color:var(--hud-ink);border-bottom:3px solid var(--gold-deep)}
.top-in{max-width:1120px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.brand{font-weight:900;font-size:1.05rem;white-space:nowrap;letter-spacing:-.02em}
.brand small{font-weight:700;color:var(--gold);margin-left:4px;font-size:.78rem}
.hudchip{display:flex;align-items:center;gap:6px;background:var(--hud2);border:1px solid var(--hud-line);border-radius:10px;padding:3px 10px;white-space:nowrap}
.hudchip .k{font-size:.7rem;color:var(--hud-muted);font-weight:800}
.hudchip .v{font-weight:900;font-size:1.05rem}
.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--hud);font-weight:900;font-size:.95rem}
.spacer{flex:1}
.tbtn{border:1px solid var(--hud-line);background:var(--hud2);color:var(--hud-ink);border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:800;white-space:nowrap;min-height:40px}
.hint{max-width:1120px;margin:0 auto;padding:4px 14px 6px;font-size:.8rem;color:var(--hud-muted)}
.hint[hidden]{display:none}
@media (max-width:700px){.brand small{display:none}.tbtn .tl{display:none}.hudchip{padding:2px 7px}.hudchip .k{display:none}}
@media (max-width:440px){.brand{display:none}}

/* ===== 자원 스트립 ===== */
.dash{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 0}
@media (max-width:980px){.dash{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.dash{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.stat .lab{font-size:.8rem;color:var(--muted);font-weight:800}
.stat .val{font-size:1.5rem;font-weight:900;line-height:1.2}
.stat .small{font-size:.75rem}
.bar{height:10px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--primary);transition:width .5s}
.stat.danger{border-color:var(--danger);background:var(--danger-bg)}
.stat.danger .bar>i{background:var(--danger)}
.stat .note{font-size:.74rem;font-weight:800;color:var(--danger);line-height:1.3;margin-top:3px}
.clockbox{display:flex;align-items:center;gap:8px}
.clock{width:54px;height:54px;flex:none;border-radius:50%;border:3px solid var(--text);position:relative;
  background:conic-gradient(var(--surface2) 0 330deg,var(--danger-bg) 330deg 360deg)}
.clock::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--text);left:50%;top:50%;transform:translate(-50%,-50%)}
.clock .tick{position:absolute;left:50%;top:2px;width:3px;height:6px;margin-left:-1.5px;background:var(--danger)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px;background:var(--text);transition:transform .6s}
.hand.h{width:4px;height:30%;margin-left:-2px}
.hand.m{width:2px;height:42%;margin-left:-1px;background:var(--danger)}
.stat.clk.hot{border-color:var(--danger)} .stat.clk.warm{border-color:var(--warn)}
.stat.stage{background:var(--hud);border-color:var(--gold-deep);color:var(--hud-ink)}
.stat.stage .lab{color:var(--gold)}
.stat.stage .small{color:var(--hud-muted)}

/* ===== 마을 풍경 ===== */
.scene{position:relative;height:175px;margin:10px 0 0;border-radius:18px 18px 0 0;overflow:hidden;border:2px solid var(--line);border-bottom:none;background:linear-gradient(var(--sky-top),var(--sky-bot))}
@media (max-width:520px){.scene{height:150px}}
.scene.folded{height:auto;background:var(--surface2);padding:4px;border-radius:18px;border-bottom:2px solid var(--line)}
.scene .layer,.scene .walkers{position:absolute;inset:0}
.scene .sun{position:absolute;top:8px;right:14px;font-size:1.8rem;line-height:1}
.scene .hill{position:absolute;left:-10%;right:-10%;bottom:28px;height:64px;border-radius:50% 50% 0 0;background:var(--hill)}
.scene .road{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--road);border-top:3px dashed var(--road-line)}
.scene .smog{position:absolute;inset:0;background:var(--smog);pointer-events:none;transition:opacity 1s}
.scene .obj{position:absolute;transform:translateX(-50%);line-height:1;user-select:none}
.scene .tree{bottom:62px;font-size:1.45rem}
.scene .stump{font-size:1.1rem;bottom:58px}
.scene .bld{bottom:30px;font-size:2rem}
.scene .smoke{position:absolute;left:55%;top:-14px;font-size:1rem;opacity:0;animation:smoke 2.4s infinite}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-28px) scale(1.5);opacity:0}}
.scene .walker{position:absolute;bottom:3px;font-size:1.6rem;line-height:1;transform:translateX(-50%)}
.scene .walker.lane2{bottom:14px;font-size:1.35rem}
.scene .walker.lane3{bottom:34px;font-size:1.3rem}
.scene .walker.fly{bottom:auto;font-size:1.1rem}
.walker .flip{display:inline-block}
.walker .who{display:inline-block;animation:bob .45s infinite alternate}
.walker.slow .who{animation-duration:.9s}
@keyframes bob{to{transform:translateY(-3px)}}
.say{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:2px solid var(--text);border-radius:12px;padding:4px 9px;font-size:.78rem;font-weight:800;white-space:nowrap;line-height:1.35;animation:pop .25s;z-index:3}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--text)}
.say.l{left:-4px;transform:none}.say.l::after{left:16px}
.say.r{left:auto;right:-4px;transform:none}.say.r::after{left:auto;right:10px}
.say.bad{border-color:var(--danger)}.say.bad::after{border-top-color:var(--danger)}
@keyframes pop{from{opacity:0}}
.scene .stag{position:absolute;top:6px;left:8px;z-index:4;display:flex;gap:6px;align-items:center;font-size:.75rem;font-weight:800;background:var(--hud);color:var(--hud-ink);border-radius:999px;padding:2px 4px 2px 10px}
.scene .tog{border:1px solid var(--hud-line);background:var(--hud2);color:var(--hud-ink);border-radius:999px;font-size:.75rem;font-weight:800;padding:3px 10px;min-height:30px}
.scene.folded .tog{width:100%;font-size:.9rem;min-height:40px;background:var(--hud);}
.voice{display:flex;align-items:center;gap:10px;background:var(--hud);color:var(--hud-ink);border-radius:0 0 18px 18px;padding:8px 14px;font-size:.92rem}
.voice[hidden]{display:none}
.voice .vk{font-weight:900;color:var(--gold);white-space:nowrap}
.voice .vt{flex:1;font-weight:700;min-width:0}
.voice .mood{white-space:nowrap;font-weight:900;font-size:.8rem;background:var(--hud2);border:1px solid var(--hud-line);border-radius:999px;padding:2px 10px}
@media (prefers-reduced-motion: reduce){.walker .who,.scene .smoke{animation:none}}

/* ===== 본문 + 사이드 ===== */
.game{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:14px;align-items:start;margin-top:12px}
.game.solo{grid-template-columns:minmax(0,820px);justify-content:center}
@media (max-width:860px){.game,.game.solo{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:1.45rem;line-height:1.35}
.panel h3{margin:14px 0 6px;font-size:1.1rem}
.sub{color:var(--muted);margin:0 0 12px}
.ribbon{display:inline-block;background:var(--hud);color:var(--gold);font-weight:900;font-size:.78rem;letter-spacing:.08em;padding:3px 12px;border-radius:6px;margin-bottom:8px}
.moa{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.moa .face{font-size:2.1rem;line-height:1;flex:none}
.bubble{background:var(--primary-soft);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:.98rem}
.btn{display:block;width:100%;min-height:56px;border:none;border-radius:14px;background:var(--primary);color:var(--primary-ink);
  font-size:1.1rem;font-weight:900;padding:12px 16px;margin-top:14px;box-shadow:0 4px 0 var(--primary-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.ghost{background:var(--surface2);color:var(--text);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--hud);box-shadow:0 4px 0 var(--gold-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
@media (max-width:640px){.tabs{grid-template-columns:1fr 1fr}}
.tab{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:900;font-size:1.05rem}
.tab[aria-pressed="true"]{background:var(--hud);color:var(--gold);border-color:var(--hud)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:120px;box-shadow:0 4px 0 var(--line)}
.card:active{transform:translateY(2px)}
.card.dev{border-color:var(--dev);background:var(--dev-bg);box-shadow:0 4px 0 var(--dev)}
.card.ref{border-color:var(--ref);background:var(--ref-bg);box-shadow:0 4px 0 var(--ref)}
.card.life{border-color:var(--sky);background:var(--sky-bg);box-shadow:0 4px 0 var(--sky)}
.card:disabled{opacity:.5;cursor:not-allowed}
.card .ttl{font-weight:900;font-size:1.12rem}
.card .meta{font-size:.88rem;color:var(--muted)}
.card .cost{font-weight:900}
.card .eff{font-size:.92rem;font-weight:700}
.badge{display:inline-block;font-size:.72rem;font-weight:900;padding:1px 8px;border-radius:999px;vertical-align:middle}
.badge.dev{background:var(--dev);color:var(--surface)}
.badge.ref{background:var(--ref);color:var(--surface)}
.badge.life{background:var(--sky);color:var(--surface)}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.98rem}
.list li:last-child{border-bottom:none}
.alert{border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:800;font-size:.95rem}
.alert.red{background:var(--danger-bg);color:var(--danger)}
.alert.sky{background:var(--sky-bg);color:var(--sky)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.gold{background:var(--hud);color:var(--gold)}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@media (max-width:520px){.tree{grid-template-columns:1fr}}
.line{border:2px solid var(--line);border-radius:14px;padding:10px}
.line.dev{border-color:var(--dev)} .line.ref{border-color:var(--ref)}
.node{font-size:.93rem;padding:3px 0}
.node.done{font-weight:900}
.node.lock{color:var(--muted)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:1.02rem;font-weight:800;min-height:56px;box-shadow:0 3px 0 var(--line)}
.choice:hover{border-color:var(--primary)}
.choice.right{border-color:var(--ref);background:var(--ref-bg)}
.choice.wrong{border-color:var(--danger);background:var(--danger-bg)}
.choice:disabled{cursor:default}
.situ{font-size:1.05rem;background:var(--surface2);border-radius:12px;padding:12px 14px;margin:8px 0}
.reveal{border:3px solid var(--gold-deep);border-radius:18px;overflow:hidden}
.reveal .rh{background:var(--hud);color:var(--hud-ink);text-align:center;padding:14px}
.reveal .rh .big{font-size:3rem;line-height:1.1}
.reveal .rh .nm{font-size:1.4rem;font-weight:900;margin-top:4px}
.reveal .rh .ribbon{background:var(--gold);color:var(--hud)}
.reveal .rb{padding:12px 14px}
.reveal .sec{margin:6px 0 10px}
.reveal .sec b{display:block;font-size:.95rem}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fx span{font-weight:900;font-size:.95rem;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.fx .pos{color:var(--ref)} .fx .neg{color:var(--danger)}
.view{border-left:5px solid var(--sky);background:var(--sky-bg);padding:10px 12px;border-radius:0 12px 12px 0;margin:10px 0}
.view b{display:block;font-size:.85rem;color:var(--sky)}
.concept{border:2px solid var(--primary);border-radius:16px;padding:12px 14px;background:var(--primary-soft)}
.concept .nm{font-size:1.1rem;font-weight:900;margin:0 0 4px}
.term{border:none;background:none;padding:0;color:var(--sky);font-weight:900;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.small{font-size:.85rem;color:var(--muted)}

/* ===== 주민 소식 ===== */
.news{display:grid;gap:8px}
.newsc{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface2)}
.newsc.good{border-color:var(--ref);background:var(--ref-bg)}
.newsc.bad{border-color:var(--danger);background:var(--danger-bg)}
.newsc.info{border-color:var(--warn);background:var(--warn-bg)}
.newsc .ne{font-size:1.9rem;line-height:1;flex:none}
.newsc b{display:block}
.newsc .small{display:block;line-height:1.45}

/* ===== 사이드 패널 ===== */
.side{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);font-size:.92rem;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 110px);overflow-y:auto}
@media (max-width:860px){.side{position:static;max-height:none}}
.side[hidden]{display:none}
.side .sh{background:var(--hud);color:var(--hud-ink);padding:10px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.side .sh span{font-size:.78rem;color:var(--gold)}
.side .sb{padding:12px 14px}
.side h4{margin:14px 0 4px;font-size:.9rem;color:var(--muted)}
.snow{background:var(--surface2);border-radius:12px;padding:8px 10px;border-left:5px solid var(--gold)}
.snow .lab{font-size:.75rem;font-weight:900;color:var(--muted)}
.snow .rtxt{font-weight:900;line-height:1.4}
.prog{margin:7px 0}
.pl{display:flex;justify-content:space-between;gap:6px;font-size:.85rem}
.pl b{white-space:nowrap}
.bar.tagb>i{background:var(--sky)}
.bar.okb>i{background:var(--ref)}
.lab7{display:flex;flex-wrap:wrap;gap:4px}
.lab7 span{font-size:1.1rem;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:2px solid var(--line);background:var(--surface2)}
.lab7 span.on{border-color:var(--gold-deep);background:var(--hud)}
.lab7 span.off{filter:grayscale(1);opacity:.45}
.slog{list-style:none;margin:0;padding:0}
.slog li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.85rem;line-height:1.4}
.slog li:last-child{border-bottom:none}
.slog .st{display:inline-block;font-size:.72rem;font-weight:900;color:var(--muted);margin-right:4px}
.slog .fx{margin:3px 0 0}
.side .fx span{font-size:.78rem;padding:1px 8px}

/* ===== 타이틀 ===== */
.title{background:var(--hud);color:var(--hud-ink);border-radius:22px;padding:30px 20px;text-align:center;border:3px solid var(--gold-deep);box-shadow:var(--shadow)}
.title .era{display:inline-block;color:var(--gold);font-weight:900;letter-spacing:.2em;font-size:.8rem;border:1px solid var(--gold-deep);border-radius:999px;padding:3px 14px}
.title .parade{font-size:2.4rem;margin:14px 0 4px;letter-spacing:.1em}
.title h1{margin:4px 0 0;font-size:3rem;line-height:1.1;letter-spacing:-.03em}
.title .ed{color:var(--gold);font-weight:900;font-size:1.15rem;margin-top:4px}
.title p{color:var(--hud-muted);margin:14px auto 18px;max-width:34em}
.title .btn{max-width:380px;margin:12px auto 0}
.title .btn.ghost{background:var(--hud2);color:var(--hud-ink);border:1px solid var(--hud-line);box-shadow:0 4px 0 var(--hud-line)}
.title .foot{margin-top:18px;font-size:.82rem;color:var(--hud-muted)}
.helpgrid{display:grid;gap:10px}
.hbox{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface2)}
.hbox h3{margin:0 0 4px;font-size:1.05rem}
.hbox ul{margin:0;padding-left:1.1em}
.hbox li{margin:2px 0;font-size:.95rem}

/* ===== 오버레이 ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,18,12,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.ov[hidden]{display:none}
.ovbox{background:var(--surface);border-radius:18px;max-width:520px;width:100%;padding:20px;border:3px solid var(--gold-deep);max-height:88vh;overflow:auto}
.ovbox h2{margin:0 0 8px}
.pausebig{font-size:3rem;text-align:center}

/* ===== 엔딩 ===== */
.end-hero{text-align:center;background:var(--hud);color:var(--hud-ink);border-radius:16px;padding:14px}
.end-hero .gr{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:16px;background:var(--gold);color:var(--hud);font-size:2.6rem;font-weight:900;line-height:1}
.end-hero .sc{color:var(--gold);font-weight:900;margin-top:4px}
.end-hero h2{font-size:1.4rem;margin:6px 0 2px}
.end-hero p{color:var(--hud-muted);margin:0;font-size:.95rem}
.final{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
@media (max-width:520px){.final{grid-template-columns:repeat(3,1fr)}}
.final div{background:var(--surface2);border-radius:12px;padding:6px;text-align:center;font-size:.85rem}
.final b{display:block;font-size:1.25rem}
.typecard{border:2px solid var(--sky);background:var(--sky-bg);border-radius:14px;padding:8px 12px;text-align:center}
.typecard b{font-size:1.15rem}
.wins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--hud2);color:var(--gold);border:1px solid var(--hud-line);font-weight:900;font-size:.85rem}
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.cardgrid{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface2);font-size:.9rem}
.mini b{display:block;font-size:1rem}
.sctable{width:100%;border-collapse:collapse;font-size:.92rem}
.sctable td{padding:4px 6px;border-bottom:1px dashed var(--line)}
.sctable td:last-child{text-align:right;font-weight:900}
.r5{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.r5 button{border:2px solid var(--ref);background:var(--ref-bg);border-radius:999px;padding:6px 12px;font-weight:900;font-size:.9rem;min-height:40px}
input.prom{width:100%;font:inherit;font-size:1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
textarea.copybox{width:100%;min-height:150px;font:inherit;font-size:.95rem;padding:10px;border-radius:12px;border:2px solid var(--warn);background:var(--surface);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hud);color:var(--gold);padding:10px 18px;border-radius:999px;font-weight:900;z-index:60}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const SEASONS = ['🌸 봄','☀️ 여름','🍂 가을','❄️ 겨울'];

/* ===================== 상태 ===================== */
let S;
function newState(){
  return {turn:1,eco:30,hap:60,nat:70,pop:20,left:90,b:{},done:[],cur:null,tags:[],social:0,
    log:[],cards:[],quizUsed:[],hand:[],report:null,phase:'title',tab:'build',endReason:null,lastQuiz:null,promise:''};
}
const has = id => S.done.includes(id);
const nb = k => S.b[k] || 0;
const totalB = () => Object.values(S.b).reduce((a,b)=>a+b,0);
const tax = () => Math.floor(S.pop/5);
const hungry = () => S.eco < S.pop/2;
const cap = () => 24 + HOUSE_B.reduce((a,k)=>a+nb(k)*BUILD[k].cap,0);
function stageIdx(){ const t=totalB(); return t>=8?4:t>=6?3:t>=4?2:t>=2?1:0; }
function bCost(id){ return Math.round(BUILD[id].cost*STAGES[stageIdx()].m); }
const clamp = () => { S.hap=Math.max(0,Math.min(100,S.hap)); S.nat=Math.max(0,Math.min(100,S.nat)); S.eco=Math.max(0,S.eco); S.left=Math.min(180,S.left); };
const fmt = n => n>0?'+'+n:(n<0?'−'+Math.abs(n):'0');
function clockStr(left){ const t=720-Math.max(0,left); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function season(t){ return `${Math.floor((t-1)/4)+1}년차 ${SEASONS[(t-1)%4]}`; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function log(txt,fx){ S.log.push({t:S.turn,txt,fx:fx||null}); }
function fxHtml(fx){
  const p=[];
  if(fx.eco) p.push(`<span class="${fx.eco>0?'pos':'neg'}">🏭 ${fmt(fx.eco)}</span>`);
  if(fx.hap) p.push(`<span class="${fx.hap>0?'pos':'neg'}">😊 ${fmt(fx.hap)}</span>`);
  if(fx.nat) p.push(`<span class="${fx.nat>0?'pos':'neg'}">🌱 ${fmt(fx.nat)}</span>`);
  if(fx.clk) p.push(`<span class="${fx.clk>0?'neg':'pos'}">⏰ ${fmt(fx.clk)}분</span>`);
  if(fx.pop) p.push(`<span class="${fx.pop>0?'pos':'neg'}">👥 ${fmt(fx.pop)}명</span>`);
  return p.length?`<div class="fx">${p.join('')}</div>`:'';
}
function applyFx(fx){ S.eco+=fx.eco||0; S.hap+=fx.hap||0; S.nat+=fx.nat||0; S.left-=fx.clk||0; clamp(); }
function dealHand(){ S.hand = shuffle(DEV_B).slice(0,2).concat(shuffle(REF_B).slice(0,2)); }

/* 점수·등급 */
function scoreParts(){
  return [['😊 행복도',S.hap],['🌱 자연 건강도',S.nat],['🏭 경제력 ÷ 4 (최대 50)',Math.round(Math.min(S.eco,200)/4)],
    ['🔬 연구 완료 × 8',S.done.length*8],['📣 사회적 활동 × 8',S.social*8],['⏰ 위기 시계 여유 (11시 기준)',Math.max(-60,Math.min(30,S.left-60))],['👥 주민 수 (최대 40)',Math.min(40,S.pop)]];
}
function score(){ return Math.max(0,scoreParts().reduce((a,b)=>a+b[1],0)); }
function gradeOf(sc){ return sc>=300?'S':sc>=250?'A':sc>=200?'B':sc>=150?'C':'D'; }
function mood(){ return S.hap>=70?'😄 활기':S.hap>=45?'🙂 평온':S.hap>=25?'😟 불만':'😫 위기'; }

const PLAYING = () => S.phase==='play';
function setPanel(html){ $('#panel').innerHTML=html; window.scrollTo({top:0}); renderTop(); renderDash(); renderScene(); renderSide(); }
function renderTop(){
  const p=PLAYING();
  $('#turnLab').textContent = p?`${S.turn} / ${MAX_T}`:(S.phase==='end'?'끝':'-');
  $('#hint').hidden = !p;
  $('#scoreChip').hidden = !(p||S.phase==='end');
  const sc=score(); $('#scoreV').textContent=sc; $('#gradeV').textContent=gradeOf(sc);
  $('#voice').hidden = !p || SC.off;
  $('#moodV').textContent = mood();
}
function renderDash(){
  const d=$('#dash');

  d.hidden=false;
  const over=S.nat<35, t=720-Math.max(0,S.left);
  const ha=((t/60)%12)*30, ma=(t%60)*6;
  const clkCls = S.left<=30?'hot':(S.left<=60?'warm':'');
  const st=STAGES[stageIdx()];
  const nextAt=[2,4,6,8][stageIdx()];
  d.innerHTML = `
   <div class="stat"><div class="lab">🏭 경제력</div><div class="val">${S.eco}</div><div class="small">건설·연구에 써요</div></div>

   <div class="stat"><div class="lab">😊 시민 행복도</div><div class="val">${S.hap}</div><div class="bar"><i style="width:${S.hap}%"></i></div></div>
   <div class="stat ${over?'danger':''}"><div class="lab">🌱 자연 건강도 (${T('자정 능력')})</div><div class="val">${S.nat}</div>
     <div class="bar"><i style="width:${S.nat}%"></i></div>${over?'<div class="note">🔴 자정 능력 초과! 회복이 아주 느려요</div>':''}</div>
   <div class="stat clk ${clkCls}"><div class="lab">⏰ ${T('위기 시계')}</div>
     <div class="clockbox"><div class="clock" aria-hidden="true"><span class="tick"></span><span class="hand h" style="transform:rotate(${ha}deg)"></span><span class="hand m" style="transform:rotate(${ma}deg)"></span></div>
     <div class="val">${clockStr(S.left)}</div></div></div>
   <div class="stat stage"><div class="lab">${T('마을 단계')}</div><div class="val">${st.e} ${st.n}</div>
     <div class="small">건설 비용 ×${st.m}${nextAt?` · 건물 ${nextAt}채부터 다음 단계`:' · 최고 단계'}</div></div>`;
}

    const pe=r.pop||[];
    body += `<h3>👥 주민 소식</h3>` + (pe.length
      ? `<div class="news">${pe.map(n=>`<div class="newsc ${n.kind}"><span class="ne">${n.e}</span><div><b>${n.title}${n.d?` ${n.d>0?'+':'−'}${Math.abs(n.d)}명`:''}</b><span class="small">${n.txt}</span></div></div>`).join('')}</div>`
      : '<p class="small">이번 계절엔 특별한 소식이 없어요. 행복도와 자연이 더 좋아지면 새 주민이 찾아올지도 몰라요.</p>');
    if(pe.length){ const n=pe[0]; sceneSay(n.e==='👶'?'아기가 태어났대요! 👶':(n.kind==='good'?'새 이웃이 이사 왔어요! 🏡':(n.kind==='info'?'우리 마을 오고 싶은데 집이 없대 🏠':(n.e==='🍞'?'이웃이 굶주려 떠났대… 😢':'마을이 점점 쓸쓸해져…'))), n.kind==='bad'); }
    if(TIPS[S.turn-1]) body += moa(TIPS[S.turn-1]);
  }
  if(EVENT_TURNS.includes(S.turn)) body += `<div class="alert gold">🗣️ 이번 계절 끝에 마을 회의(딜레마)가 열려요.</div>`;
  else { const nx=EVENT_TURNS.find(t=>t>S.turn); if(nx) body += `<p class="small">🗓️ 다음 마을 회의: ${nx}계절</p>`; }
  if(S.cur) body += `<div class="alert warn">⏳ ${RES[S.cur.id].e} ${RES[S.cur.id].n} 연구가 진행 중이에요. ‘연구하기’에서 이어서 완성할 수 있어요.</div>`;
  setPanel(`<span class="ribbon">TURN ${S.turn}</span><h2>${season(S.turn)}</h2><p class="sub">${S.turn}번째 계절이 밝았어요.</p>${body}
    <button class="btn" onclick="showAction('${S.tab}')">⚡ 이번 계절 행동 고르기</button>`);
}

/* ===================== 행동 선택 ===================== */
function showAction(tab){
  S.tab=tab;
  const tabs = `<div class="tabs" role="group" aria-label="행동 종류">
    <button class="tab" aria-pressed="${tab==='build'}" onclick="showAction('build')">🏭 생산 시설</button>
    <button class="tab" aria-pressed="${tab==='house'}" onclick="showAction('house')">🏠 주거 단지</button>
    <button class="tab" aria-pressed="${tab==='amen'}" onclick="showAction('amen')">🎡 편의시설</button>
    <button class="tab" aria-pressed="${tab==='research'}" onclick="showAction('research')">🔬 연구</button></div>`;
  let inner='';
  const st=STAGES[stageIdx()];
  const card=id=>{
    const c=BUILD[id], cost=bCost(id), can=S.eco>=cost;
    const now=[]; if(!c.cat){ if(c.now.eco) now.push('즉시 경제 +'+c.now.eco); if(c.now.hap) now.push('즉시 행복 +'+c.now.hap); }
    const bl={dev:'발전',ref:'성찰',life:'생활'}[c.type];
    return `<button class="card ${c.type}" ${can?'':'disabled'} onclick="doBuild('${id}')">
      <span class="ttl">${c.e} ${c.n} <span class="badge ${c.type}">${bl}</span>${nb(id)?` <span class="small">보유 ${nb(id)}</span>`:''}</span>
      <span class="meta"><span class="cost">비용 🏭 ${cost}</span> <span class="small">(기본 ${c.cost} × ${st.m})</span>${can?'':' · 경제력 부족'}</span>
      <span class="eff">${now.length?now.join(', ')+' · ':''}${c.per}</span></button>`;
  };
  const rest=`<button class="btn ghost" onclick="doRest()">😴 이번 계절은 쉬어 가기 (경제 +3)</button>`;
  const costNote=`지금 ${st.e} ${st.n} 단계라 모든 건설 비용이 ×${st.m}이에요.`;
  if(tab==='build'){
    inner = `<p class="sub">돈과 에너지를 만드는 시설이에요. <span class="badge dev">발전</span>은 돈을 빨리 벌고, <span class="badge ref">성찰</span>은 자연을 돌봐요. 카드는 계절마다 바뀌어요. ${costNote}</p>
      <div class="cards">${S.hand.map(card).join('')}</div>${rest}`;
  } else if(tab==='house'){
    const full=S.pop>=cap();
    inner = `<p class="sub">새 주민이 이사 오거나 아기가 태어나려면 빈집이 필요해요. 지금 🏠 집 ${S.pop}/${cap()}칸이에요. ${costNote}</p>
      ${full?'<div class="alert warn">🏠 빈집이 없어요! 지금은 새 주민이 들어올 수 없어요.</div>':''}
      <div class="cards">${HOUSE_B.map(card).join('')}</div>${rest}`;
  } else if(tab==='amen'){
    inner = `<p class="sub">주민의 삶을 즐겁고 편하게 만드는 시설이에요. 행복도는 올라가지만, 자연에 주는 영향은 시설마다 달라요. ${costNote}</p>
      <div class="cards">${AMEN_B.map(card).join('')}</div>${rest}`;
  } else {
    const node=(id,line)=>{
      const r=RES[id]; let cls='lock', mark='🔒';
      if(has(id)){cls='done';mark='✅';}
      else if(S.cur&&S.cur.id===id){cls='';mark='⏳';}
      else { const L=line==='dev'?DEV_LINE:REF_LINE; const nx=L.find(x=>!has(x)); if(nx===id){cls='';mark='▶';} }
      return `<div class="node ${cls}">${mark} ${r.tier}단계 ${r.e} ${r.n} <span class="small">🏭${r.cost}</span></div>`;
    };
    inner = `<div class="tree">
      <div class="line dev"><b>🏭 발전 계열</b>${DEV_LINE.map(i=>node(i,'dev')).join('')}</div>
      <div class="line ref"><b>🌿 성찰 계열</b>${REF_LINE.map(i=>node(i,'ref')).join('')}</div></div>
      <p class="small">단계가 깊어질수록 연구비가 올라가요. 연구를 끝내면 새 지식 카드와 퀴즈 1문항을 받아요.</p>`;
    if(S.cur){
      const r=RES[S.cur.id];
      inner += `<button class="card ${r.line}" style="width:100%" onclick="doResearch('${S.cur.id}')">
        <span class="ttl">⏳ ${r.e} ${r.n} 연구 계속하기</span><span class="meta">비용은 이미 냈어요 · 이번 계절이면 완성!</span><span class="eff">${r.eff}</span></button>`;
    } else {
      const nd=DEV_LINE.find(x=>!has(x)), nr=REF_LINE.find(x=>!has(x));
      const opts=[nd,nr].filter(Boolean);
      if(!opts.length) inner += `<div class="alert sky">모든 연구를 마쳤어요! 이제 건설로 마을을 돌봐 주세요.</div>`;
      inner += `<div class="cards">` + opts.map(id=>{
        const r=RES[id], can=S.eco>=r.cost;
        return `<button class="card ${r.line}" ${can?'':'disabled'} onclick="doResearch('${id}')">
          <span class="ttl">${r.e} ${r.n} <span class="badge ${r.line}">${r.line==='dev'?'발전':'성찰'} ${r.tier}단계</span></span>
          <span class="meta"><span class="cost">비용 🏭 ${r.cost}</span> · ${r.turns}계절 걸림${can?'':' · 경제력 부족'}</span>
          <span class="eff">${r.eff}</span></button>`;
      }).join('') + `</div>`;
    }
  }
  setPanel(`<span class="ribbon">⚡ 이번 계절 행동</span><h2>${season(S.turn)}: 무엇을 할까요?</h2>${tabs}${inner}`);
}

function doBuild(id){
  const c=BUILD[id], cost=bCost(id); if(S.eco<cost) return;
  const before=stageIdx();
  S.eco-=cost; S.b[id]=nb(id)+1; applyFx(c.now);
  log(`${c.e} ${c.n} 건설`, {eco:(c.now.eco||0)-cost, hap:c.now.hap||0, nat:c.now.nat||0});
  const up=stageIdx()>before, st=STAGES[stageIdx()];
  if(up) log(`${st.e} 마을이 ‘${st.n}’ 단계로 성장 (건설 비용 ×${st.m})`);
  setPanel(`<span class="ribbon">BUILT</span><h2>${c.e} ${c.n} 완공!</h2>
    <div class="situ">${c.env}</div>
    ${fxHtml({eco:(c.now.eco||0)-cost,hap:c.now.hap||0,nat:c.now.nat||0})}
    <p class="small">앞으로 ${c.per}</p>
    ${c.cap?`<div class="alert sky">🏠 빈집이 ${c.cap}칸 늘어 이제 최대 ${cap()}명이 살 수 있어요.</div>`:''}
    ${up?`<div class="alert gold">🎉 마을이 ${st.e} ‘${st.n}’ 단계로 성장했어요! 이제 건설 비용이 기본의 ×${st.m}가 돼요.</div>`:''}
    ${c.type==='dev'?moa('살기는 편해지겠지만… 숲이 조금 숨차 하는 것 같아.'):(c.type==='life'?moa('주민들이 한결 든든해졌어. 그런데 아픈 원인은 무엇일까?'):moa('숲이 한숨 돌렸어. 고마워!'))}
    <button class="btn" onclick="afterAction()">계속한다</button>`);
  sceneSay(BUILD_SAY[id][0], BUILD_SAY[id][1]);
}
function doRest(){
  S.eco+=3; log('😴 쉬어 가기',{eco:3});
  setPanel(`<h2>😴 한 계절 쉬어 가요</h2>${fxHtml({eco:3})}${moa('가끔은 쉬면서 다음 계획을 세우는 것도 좋아.')}<button class="btn" onclick="afterAction()">계속한다</button>`);
}
function doResearch(id){
  const r=RES[id];
  if(S.cur&&S.cur.id===id){ S.cur=null; completeResearch(id); return; }
  if(S.eco<r.cost) return;
  S.eco-=r.cost;
  if(r.turns===1){ completeResearch(id,r.cost); return; }
  S.cur={id}; log(`🔬 ${r.n} 연구 시작`,{eco:-r.cost});
  setPanel(`<span class="ribbon">RESEARCH</span><h2>⏳ ${r.e} ${r.n} 연구 시작!</h2>
    <p class="sub">이 연구는 두 계절이 걸려요. 다음 계절에 ‘연구 → 연구 계속하기’를 고르면 완성돼요.</p>
    ${fxHtml({eco:-r.cost})}
    ${moa('천천히, 깊이 생각할수록 더 단단한 생각이 자라.')}
    <button class="btn" onclick="afterAction()">계속한다</button>`);
}
function completeResearch(id,paid=0){
  const r=RES[id]; S.done.push(id);
  if(id==='industrial') S.eco+=10;
  if(id==='consumer') S.hap+=3;
  clamp();
  S.cards.push({e:r.e,n:r.n,d:r.d});
  log(`${r.e} ${r.n} 연구 완료`,{eco:(id==='industrial'?10:0)-paid, hap:(id==='consumer'?3:0)});
  const left=QUIZ.length-S.quizUsed.length;
  setPanel(`<div class="reveal">
     <div class="rh"><span class="ribbon">NEW KNOWLEDGE</span><div class="big">${r.e}</div><div class="nm">${r.n}</div>
       <div class="small" style="color:var(--hud-muted)">${r.line==='dev'?'발전':'성찰'} 계열 ${r.tier}단계 해금</div></div>
     <div class="rb">
       <div class="sec"><b>✨ 우리 마을을 이렇게 바꿨어요</b>${r.d}</div>
       <div class="sec"><b>⚖️ 하지만 다른 얼굴도 있어요</b>${r.f}</div>
       <div class="sec"><b>🎮 게임에서의 효과</b>${r.eff}</div>
     </div></div>
    ${left?`<button class="btn" onclick="showQuiz()">✏️ 해금 확인 퀴즈 풀기</button>`:`<button class="btn" onclick="afterAction()">계속한다</button>`}`);
  sceneSay(r.line==='dev'?'새 기술이 생겼대! 💡':'우리 생각이 한 뼘 자랐어 🌱', false);
}

/* ===================== 퀴즈 ===================== */
function showQuiz(){
  const pool=QUIZ.map((_,i)=>i).filter(i=>!S.quizUsed.includes(i));
  const qi=pool[Math.floor(Math.random()*pool.length)];
  S.quizUsed.push(qi); S.lastQuiz=qi;
  const q=QUIZ[qi];
  setPanel(`<span class="ribbon">QUIZ</span><h2>✏️ 해금 확인 퀴즈</h2><p class="sub">${q.o.length===2?'O/X 문제':'4지선다 문제'} · 맞히면 🏭+5 🌱+3</p>
    <div class="situ"><b>${q.q}</b></div>
    ${q.o.map((o,i)=>`<button class="choice" onclick="answer(${i})">${o}</button>`).join('')}`);
}
function answer(i){
  const q=QUIZ[S.lastQuiz], ok=i===q.a;
  if(ok){ S.eco+=5; S.nat+=3; clamp(); }
  log(ok?'✅ 퀴즈 정답 보너스':'❌ 퀴즈 오답(해설 확인)', ok?{eco:5,nat:3}:null);
  const opts=q.o.map((o,k)=>`<button class="choice ${k===q.a?'right':(k===i?'wrong':'')}" disabled>${k===q.a?'✅ ':(k===i?'❌ ':'')}${o}</button>`).join('');
  setPanel(`<h2>${ok?'🎯 정답이에요!':'🤔 아쉬워요'}</h2>
    <div class="situ"><b>${q.q}</b></div>${opts}
    ${moa(q.x)}
    ${ok?fxHtml({eco:5,nat:3}):'<p class="small">틀려도 괜찮아요. 해설을 기억해 두세요.</p>'}
    <button class="btn" onclick="afterAction()">계속한다</button>`);
}

/* ===================== 흐름 ===================== */
function checkOver(){
  if(S.hap<=0){ finish('hap'); return true; }
  if(S.left<=0){ finish('clock'); return true; }
  if(S.pop<=0){ finish('pop'); return true; }
  return false;
}
function afterAction(){
  if(checkOver()) return;
  if(EVENT_TURNS.includes(S.turn)) showEvent(); else endTurn();
}

/* ===================== 딜레마 이벤트 ===================== */
function showEvent(){
  const ei=EVENT_TURNS.indexOf(S.turn), ev=EVENTS[ei];
  setPanel(`<span class="ribbon">🃏 계절의 사건 · 마을 회의 ${ei+1}/${EVENTS.length}</span>
    <h2>${ev.e} ${ev.title}</h2>
    <div class="situ">${ev.situ}</div>
    <p class="small">정답은 없어요. 짝과 이유를 말한 뒤 골라 보세요. 📣 표시는 ‘사회적 활동’이에요.</p>
    ${ev.ch.map((c,i)=>`<button class="choice" onclick="chooseEvent(${i})">${c.t}</button>`).join('')}`);
}
function chooseEvent(i){
  const ev=EVENTS[EVENT_TURNS.indexOf(S.turn)], c=ev.ch[i];
  const fx={...c.fx};
  let boosted=false;
  if(c.social && has('social')){ for(const k of ['eco','hap','nat']) if(fx[k]>0){fx[k]=Math.round(fx[k]*1.5);boosted=true;} }
  applyFx(fx); S.tags.push(c.tag);
  if(c.social) S.social++;
  S.cards.push(ev.card);
  log(`${ev.e} ${ev.title}: ${c.t.replace(/^\S+\s/,'')} → ${TAG[c.tag]}에 가까움`, fx);
  setPanel(`<span class="ribbon">회의 결과</span><h2>${ev.e} ${ev.title}</h2>
    <div class="situ"><b>${c.t}</b><br>${c.res}</div>
    ${fxHtml(fx)}${boosted?'<p class="small">📣 사회적 활동 연구 덕분에 효과가 1.5배가 되었어요!</p>':''}
    <div class="view"><b>이 선택은 어떤 자연관에 가까울까?</b>${c.line}</div>
    ${c.social?`<div class="alert sky">📣 사회적 활동 ${S.social}회 (실천 승리까지 ${Math.max(0,3-S.social)}회 남음)</div>`:''}
    <div class="concept" style="margin-top:10px"><div class="nm">${ev.card.e} 개념 카드: ${ev.card.n}</div><div>${ev.card.d}</div></div>
    <button class="btn" onclick="if(!checkOver()) endTurn()">⏭️ 계절 마무리하기</button>`);
  const es = c.social ? ['함께 목소리 내길 잘했어! 📣',false] : (c.tag==='human' ? ['돈은 벌었는데 숲이 걱정돼…',true] : (c.tag==='eco' ? ['자연은 지켰지만 살림이 빠듯해 😥',true] : ['우리 마을다운 결정이야 🙂',false]));
  sceneSay(es[0], es[1]);
}

/* ===================== 계절 정산 ===================== */
function endTurn(){
  const b0={eco:S.eco,hap:S.hap,nat:S.nat,left:S.left};
  const over=S.nat<35, lowEco=S.eco<30;
  const lines=[`💰 주민 ${S.pop}명의 세금: 경제 +${tax()}`];
  const pp=Math.max(0,Math.floor((S.pop-20)/10));
  if(pp) lines.push(`🗑️ 주민이 늘어 생활 쓰레기·에너지 사용 증가: 자연 −${pp}`);
  let de=0,dn=0;
  const ind=has('industrial');
  de+=nb('factory')*(8+(ind?3:0)); dn-=nb('factory')*(4+(ind?1:0));
  de+=nb('ranch')*5; dn-=nb('ranch')*3;
  de+=nb('mine')*4;  dn-=nb('mine')*3;
  de+=nb('logging')*3; dn-=nb('logging')*4;
  if(has('massprod')){de+=5;dn-=2;}
  if(has('consumer')){de+=6;dn-=3;}
  let re=0,rn=0,rh=0; const bo=has('ecosens')?1:0;
  re+=nb('solar')*3; rn+=nb('solar')*(2+bo);
  re+=nb('recycle')*2; rn+=nb('recycle')*(2+bo); rh+=nb('recycle');
  rn+=nb('park')*(3+bo);
  rn+=nb('bike')*(1+bo); rh+=nb('bike');
  if(has('ecolife')) rn+=2;
  if(has('fiveR')){rn+=2;re+=2;}
  if(has('social')) rh+=2;
  if(has('ecosens')) rh+=1;
  if(over) rn=Math.floor(rn/2);
  let le=0,ln=0,lh=0;
  [...HOUSE_B,...AMEN_B].forEach(k=>{ const p=BUILD[k].pt||{}, n=nb(k); le+=(p.eco||0)*n; ln+=(p.nat||0)*n; lh+=(p.hap||0)*n; });
  if(over && ln>0) ln=Math.floor(ln/2);
  const regen=over?1:3;
  let hp=0;
  if(de||dn) lines.push(`🏭 발전 시설·연구: 경제 ${fmt(de)}, 자연 ${fmt(dn)}`);
  if(re||rn||rh) lines.push(`🌿 성찰 시설·연구: 경제 ${fmt(re)}, 자연 ${fmt(rn)}, 행복 ${fmt(rh)}${over?' (자정 능력 초과로 자연 회복 절반)':''}`);
  if(le||ln||lh) lines.push(`🏠 주거 단지·편의시설: 경제 ${fmt(le)}, 자연 ${fmt(ln)}, 행복 ${fmt(lh)}`);
  lines.push(`🌱 자연 스스로 회복: ${fmt(regen)}${over?' (자정 능력 초과로 느려짐)':''}`);
  if(lowEco && !hungry()){hp-=4; lines.push('😟 살림이 빠듯해요(경제력 30 미만): 행복 −4');}
  if(over){hp-=5; lines.push('😷 공기가 탁해요(자연 35 미만): 행복 −5');}
  S.eco+=tax()+de+re+le; S.nat+=dn+rn+ln+regen-pp; S.hap+=rh+lh+hp; clamp();
  let clk;
  if(S.nat>=70) clk=-6; else if(S.nat>=55) clk=0; else if(S.nat>=35) clk=6; else clk=15;
  S.left-=clk; clamp();
  lines.push(clk===0?'⏰ 위기 시계: 그대로 멈춰 있어요':(clk<0?`⏰ 위기 시계: ${Math.abs(clk)}분 뒤로 돌아갔어요 🙂`:`⏰ 위기 시계: ${clk}분 앞으로 갔어요 😟`));
  S.report={lines};
  log(`${SEASONS[(S.turn-1)%4]} 계절 정산`,{eco:S.eco-b0.eco,hap:S.hap-b0.hap,nat:S.nat-b0.nat,clk:b0.left-S.left});
  S.report.pop=popEvents();
  if(checkOver()) return;
  if(S.turn>=MAX_T){ finish('done'); return; }
  S.turn++; dealHand(); showReport();
}

/* ===================== 주민 소식(조건부 이벤트) ===================== */
function popEvents(){
  const ev=[];
  const add=(e,title,txt,d,dh,kind)=>{
    const before=S.pop; S.pop=Math.max(0,Math.min(99,S.pop+d)); const real=S.pop-before;
    S.hap+=dh; ev.push({e,title,txt,d:real,kind}); log(`${e} ${title}`,{pop:real,hap:dh});
  };
  const half=S.pop/2;
  if(S.eco<half){ const n=Math.max(1,Math.ceil((half-S.eco)/5));
    add('🍞','굶주림',`곳간이 비어 주민 ${n}명이 굶주림 끝에 세상을 떠났어요. (조건: 경제력 ${S.eco} < 주민 수÷2 = ${Math.ceil(half)})`,-n,-3,'bad'); }
  if(S.nat<25 && S.pop>0){
    if(nb('clinic')){ S.hap-=1; ev.push({e:'🏥',title:'보건소에서 치료',txt:'오염 때문에 병에 걸린 주민들이 보건소에서 치료를 받았어요. 하지만 오염이 계속되면 환자도 계속 생겨요. (조건: 자연 건강도 25 미만 + 보건소 있음)',d:0,kind:'info'}); log('🏥 보건소에서 오염 환자 치료',{hap:-1}); }
    else add('😷','오염으로 생긴 병','탁한 공기와 물 때문에 병을 앓던 주민 1명이 세상을 떠났어요. (조건: 자연 건강도 25 미만, 보건소 없음)',-1,-3,'bad');
  }
  if(S.hap<25 && S.pop>0){ const n=S.hap<12?3:2;
    add('🧳','마을을 떠난 가족',`살기 힘들다며 주민 ${n}명이 짐을 싸서 떠났어요. (조건: 행복도 25 미만)`,-n,0,'bad'); }
  const room=()=>cap()-S.pop;
  let wanted=false;
  if(S.hap>=65 && S.nat>=50){ wanted=true; if(room()>0){ const n=Math.min(3,room());
    add('🏡','소문 듣고 이사 옴',`“공기 맑고 살기 좋은 마을”이라는 소문을 듣고 새 주민 ${n}명이 이사 왔어요. (조건: 행복도 65 이상 + 자연 50 이상 + 빈집)`,n,1,'good'); } }
  else if(S.hap>=65 && S.eco>=80){ wanted=true; if(room()>0){ const n=Math.min(2,room());
    add('🧑‍💼','일자리 찾아 이사 옴',`일자리가 많다는 소문에 ${n}명이 이사 왔어요. 하지만 공기가 탁하다며 걱정해요. (조건: 행복도 65 이상 + 경제력 80 이상 + 빈집)`,n,0,'good'); } }
  if(S.hap>=60 && S.nat>=35 && S.pop>0 && S.eco>=S.pop){ wanted=true; if(room()>0)
    add('👶','아기 탄생','새벽뜰에 아기가 태어났어요! 마을 전체가 축하했어요. (조건: 행복도 60 이상 + 자연 35 이상 + 경제력이 주민 수 이상 + 빈집)',1,2,'good'); }
  if(wanted && room()<=0)
    ev.push({e:'🏠',title:'집이 모자라요',txt:`마을에 오고 싶어 하는 사람이 있지만 빈집이 없어요. 건물을 더 지어요. ‘🏠 주거 단지’ 탭에서 집을 지으면 빈집이 늘어나요. (현재 최대 ${cap()}명)`,d:0,kind:'info'});
  clamp();
  return ev;
}

function natureType(){
  const c={}; S.tags.forEach(t=>c[t]=(c[t]||0)+1);
  if((c.human||0)>=3) return 'human';
  if((c.eco||0)>=3) return 'eco';
  const east=['confucian','buddhist','taoist'].map(k=>[k,c[k]||0]).sort((a,b)=>b[1]-a[1]);
  if(east[0][1]>=1 && east[0][1]>east[1][1] && (c.balance||0)<=2) return east[0][0];
  return 'balance';
}

  else if(S.eco>=150 && S.nat<35){ R.emo='⚠️'; R.title='인간의 삶마저 위협받는 결말'; R.msg='마을은 부자가 되었지만 공기와 물이 탁해졌어요. 지나친 개발은 결국 인간의 삶까지 위협해요.'; R.cap='C'; }
  else {

    else { R.emo='😅'; R.title='아쉬운 무승부'; R.msg='마을은 버텼지만 승리 조건에는 닿지 못했어요. 다음엔 어떤 균형을 시도해 볼까요?'; R.cap='C'; }
  }
  const sc=score(); let g=gradeOf(sc);
  if(R.cap && 'SABCD'.indexOf(g) < 'SABCD'.indexOf(R.cap)) g=R.cap;
  R.score=sc; R.grade=g;
  S.result=R; S.type=natureType();
  showEnding();
}

  let h='';
  TREE_ORDER.forEach((p,i)=>{ const x=TREE_POS[p];
    if(i<nt) h+=`<span class="obj tree" style="left:${x}%">${i%3===1?'🌲':'🌳'}</span>`;
    else if(i<nt+stumps) h+=`<span class="obj tree stump" style="left:${x}%">🪵</span>`; });
  const blds=[]; Object.keys(SHOW).forEach(k=>{ for(let i=0;i<Math.min(2,nb(k));i++) blds.push(k); });
  const st=stageIdx();
  const houses=[1,2,3,4,5][st];
  const items=[];
  for(let i=0;i<Math.max(houses,blds.length);i++){ if(i<houses) items.push(st>=3&&i%2?'🏢':(i%2?'🏡':(st===0?'🛖':'🏠'))); if(i<blds.length) items.push(blds[i]); }
  const n=items.length;
  items.forEach((it,i)=>{ const x=n===1?50:5+i*(90/(n-1));
    h+=`<span class="obj bld" style="left:${x}%">${SHOW[it]||it}${it==='factory'?'<span class="smoke">💨</span>':''}</span>`; });
  return `<div class="sun">${sun}</div><div class="hill"></div>${h}<div class="road"></div><div class="smog" style="opacity:${smog}"></div>`;
}
function syncWalkers(){
  const spec=[]; const np=Math.max(1,Math.min(9,Math.round(S.pop/4)));
  for(let i=0;i<np;i++) spec.push('p');
  for(let i=0;i<Math.min(3,nb('bike')*2);i++) spec.push('bike');
  for(let i=0;i<Math.min(2,nb('ranch'));i++) spec.push('cow');
  if(S.nat>=60) spec.push('bird','bird');
  if(nb('park')&&S.nat>=40) spec.push('fly');
  const slow=S.hap<35;
  const key=spec.join(',')+(slow?'s':'');
  if(key===SC.wkey) return; SC.wkey=key;
  const box=$('#scene .walkers'); box.innerHTML=''; SC.walkers=[];
  const rm=RM?0.35:1;
  spec.forEach((k,i)=>{
    const w={kind:k,x:5+Math.random()*90,fly:false,y:0,person:k==='p',say:null};
    let em, sp, cls='';
    if(k==='p'){ em=PEOPLE[(i*5+S.turn)%PEOPLE.length]; sp=(2.5+Math.random()*2)*(slow?.45:1); if(slow) cls=' slow'; }
    else if(k==='bike'){ em='🚴'; sp=9+Math.random()*3; cls=' lane2'; }
    else if(k==='cow'){ em='🐄'; sp=.8; cls=' lane3'; }
    else if(k==='bird'){ em='🕊️'; sp=6+Math.random()*2; w.fly=true; w.y=12+Math.random()*28; cls=' fly'; }
    else { em='🦋'; sp=3; w.fly=true; w.y=58+Math.random()*16; cls=' fly'; }
    w.v=sp*rm*(Math.random()<.5?-1:1);
    w.wrap=(k==='bike'||k==='bird');
    const d=document.createElement('div'); d.className='walker'+cls;
    d.innerHTML=`<span class="flip"><span class="who">${em}</span></span>`;
    d.style.left=w.x+'%'; if(w.fly) d.style.top=w.y+'px';
    w.el=d; w.flipEl=d.firstChild; setFlip(w);
    box.appendChild(d); SC.walkers.push(w);
  });
}
function setFlip(w){ if(!w.person) w.flipEl.style.transform = w.v>0?'scaleX(-1)':''; }
function renderScene(){
  const el=$('#scene');
  if(!PLAYING()){ el.hidden=true; return; }
  el.hidden=false;
  if(SC.off){
    if(!el.classList.contains('folded')){ el.className='scene folded'; el.innerHTML=`<button class="tog" onclick="toggleScene()">🎬 마을 풍경 펼치기</button>`; SC.walkers=[]; SC.wkey=''; }
    return;
  }
  if(!el.querySelector('.layer')){
    el.className='scene';
    el.innerHTML=`<div class="layer"></div><div class="walkers"></div><div class="stag"><span id="popLab"></span><button class="tog" onclick="toggleScene()">접기</button></div>`;
    SC.wkey='';
  }
  el.querySelector('.layer').innerHTML=sceneStatic();
  syncWalkers();
  $('#popLab').textContent=`${STAGES[stageIdx()].e} 새벽뜰 · 주민 ${S.pop}명`;
}
function toggleScene(){ SC.off=!SC.off; SC.walkers=[]; SC.wkey=''; renderScene(); renderTop(); }
function moodLines(){
  const L=[]; const add=(t,w,bad)=>L.push({t,w,bad:!!bad});
  add('안녕하세요, 촌장님! 👋',.6);
  if(hungry()){ add('배가 고파요… 🍞',4,1); add('곳간이 텅 비었대 😢',3,1); }
  const rp=(S.report&&S.report.pop)||[];
  if(rp.some(n=>n.e==='👶')) add('아기 울음소리가 들려요 👶',3);
  if(rp.some(n=>n.kind==='good'&&n.e!=='👶')) add('새로 이사 왔어요, 잘 부탁해요! 🏡',3);
  if(rp.some(n=>n.kind==='bad')) add('요즘 마을에 슬픈 일이 많아…',2,1);
  if(S.hap>=70) add('요즘 마을 살 맛 나요! 😄',2);
  if(S.hap<35){ add('이 마을 떠나고 싶어… 😞',3,1); add('너무 지쳤어요… 😩',2,1); }
  if(S.eco<20){ add('배가 고파요… 🍞',3,1); add('장바구니가 텅 비었어 😢',2,1); add('일자리가 없어서 힘들어요',2,1); }
  else if(S.eco<30) add('살림이 좀 빠듯하네… 💸',2,1);
  if(S.eco>=80) add('월급이 올랐어! 💰',1);
  if(stageIdx()>=3) add('집값이 너무 올랐어… 🏢',1,1);
  if(S.nat>=70){ add('새소리가 들려요 🐦',2); add('숲 냄새 참 좋다 🌲',1); }
  if(S.nat<55) add('하늘이 좀 뿌옇네… 🌫️',2,1);
  if(S.nat<45) add('콜록콜록, 미세 먼지 😷',3,1);
  if(S.nat<35){ add('강물에서 냄새가 나요 🤢',3,1); add('새소리가 사라졌어…',2,1); }
  if(S.left<=45) add('위기 시계가 자정에 가까워! ⏰',3,1);
  if(nb('factory')) add('공장 덕에 일자리가 생겼어 🏭',1);
  if(nb('logging')) add('숲이 점점 줄어드네… 🪵',1,1);
  if(nb('ranch')) add('목장 땅이 메말라 가 🏜️',1,1);
  if(nb('mine')) add('광산 폐수가 걱정돼요',1,1);
  if(nb('park')) add('공원 산책 너무 좋아요 🌼',1);
  if(nb('bike')) add('자전거로 출근해요 🚲',1);
  if(nb('recycle')) add('분리배출 깨끗하게! ♻️',1);
  if(nb('solar')) add('햇빛으로 전기를 만든대 ☀️',1);
  if(S.pop>=cap()) add('우리 마을에 빈집이 없대 🏠',2,1);
  if(nb('mall')) add('쇼핑몰 또 갔어! 봉투가 한가득…',1,1);
  if(nb('themepark')) add('놀이공원 너무 재밌어 🎢',1);
  if(nb('clinic')) add('보건소 덕분에 마음이 놓여',1);
  if(nb('market')) add('동네 농장 채소 최고! 🥕',1);
  if(nb('ecohome')) add('우리 집 옥상에 새가 와 🐦',1);
  if(nb('apt')) add('아파트 단지에 녹지가 부족해',1,1);
  if(has('fiveR')) add('오늘도 텀블러 챙겼어요 🥤',1);
  if(has('consumer')) add('새 옷 또 샀어! 옷장은 꽉 찼는데…',1,1);
  if(has('ecosens')) add('길가 풀꽃도 예쁘네 🌱',1);
  if(S.social>=1) add('함께 목소리 내니 바뀌네! 📣',1);
  return L;
}
function alignSay(w){ if(w.say){ w.say.classList.toggle('l',w.x<18); w.say.classList.toggle('r',w.x>82); } }
function randomSay(text,bad){
  if(!PLAYING()) return;
  if(!text){
    if(SC.walkers.filter(w=>w.say).length>=2) return;
    const L=moodLines(); let r=Math.random()*L.reduce((a,b)=>a+b.w,0), pick=L[0];
    for(const l of L){ r-=l.w; if(r<=0){ pick=l; break; } }
    text=pick.t; bad=pick.bad;
  }
  $('#voiceTxt').textContent=`“${text}”`;
  const free=SC.walkers.filter(w=>w.person&&!w.say);
  if(!free.length) return;
  const w=free[Math.floor(Math.random()*free.length)];
  const s=document.createElement('div'); s.className='say'+(bad?' bad':''); s.textContent=text;
  w.el.appendChild(s); w.say=s; alignSay(w);
  setTimeout(()=>{ s.remove(); if(w.say===s) w.say=null; },2800);
}
function sceneSay(text,bad){ setTimeout(()=>randomSay(text,bad),350); }
function scenePaused(){ return !$('#pauseOv').hidden || !$('#modal').hidden || document.hidden; }
function tick(t){
  requestAnimationFrame(tick);
  const dt=Math.min(50,t-(SC.last||t)); SC.last=t;
  if(SC.off||!S||!PLAYING()||scenePaused()||!SC.walkers.length) return;
  for(const w of SC.walkers){
    w.x+=w.v*dt/1000;
    if(w.wrap){ if(w.x>105) w.x=-5; if(w.x<-5) w.x=105; }
    else { if(w.x>95){ w.v=-Math.abs(w.v); setFlip(w); } if(w.x<5){ w.v=Math.abs(w.v); setFlip(w); } }
    w.el.style.left=w.x+'%';
    if(w.fly) w.el.style.top=(w.y+Math.sin(t/380+w.x)*4)+'px';
    alignSay(w);
  }
  SC.sayT-=dt;
  if(SC.sayT<=0){ SC.sayT=2400+Math.random()*1800; randomSay(); }
}
requestAnimationFrame(tick);

S=newState(); showTitle();
